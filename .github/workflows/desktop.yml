name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Stage packages with unique architecture names
        run: node scripts/stage-packages.mjs src-tauri/target/${{ matrix.target }}/release/bundle release-packages ${{ matrix.os == 'macos-14' && 'aarch64' || 'x64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: drgg-${{ matrix.name }}
          path: release-packages/*
          if-no-files-found: error
  assemble:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: drgg-*
          merge-multiple: true
          path: release-packages
      - run: node --test scripts/*.test.mjs
      - run: node scripts/prepare-release.mjs release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: drgg-release-complete
          path: release-packages/*
          if-no-files-found: error
      - name: Prepare draft for tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "$RELEASE_TAG" = "v$version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --title "DRGG $version" --notes-file "docs/releases/$version.md"
          fi
          gh release upload "$RELEASE_TAG" release-packages/* --clobber
